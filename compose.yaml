services:
  reelarr:
    build: .
    container_name: reelarr
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8282}:8282"
    environment:
      DATA_DIR: /data
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8282}"
      SECURE_COOKIES: "${SECURE_COOKIES:-false}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      TZ: "${TZ:-UTC}"
    volumes:
      - reelarr-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  reelarr-data:
