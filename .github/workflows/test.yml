name: App checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/static/app.js
      - name: Verify native server login and persistence
        run: python tests/smoke_native.py
      - name: Verify Windows installer and boot startup
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\smoke_windows.ps1
