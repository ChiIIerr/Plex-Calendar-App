name: App checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/static/app.js
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Start the packaged server
        run: docker compose up -d --wait --wait-timeout 90
      - name: Verify container login and persistence
        run: python tests/smoke_container.py
      - name: Stop the test server
        if: always()
        run: docker compose down -v
